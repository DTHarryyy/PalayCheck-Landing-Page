name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  e2e:
    name: E2E (${{ matrix.app_status }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CTA is baked in at build time, so test both states.
        app_status: [coming_soon, live]
    env:
      NEXT_PUBLIC_APP_STATUS: ${{ matrix.app_status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.app_status }}
          path: playwright-report
          retention-days: 7
